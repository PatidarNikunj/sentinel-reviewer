# ─────────────────────────────────────────────────────────────────────────────
# Sentinel Reviewer — Security Gate CI/CD Pipeline
# Runs Semgrep static analysis + Snyk dependency scanning
# Features: retry-on-failure, re-trigger on PR update, PR status gating
# ─────────────────────────────────────────────────────────────────────────────

name: 🛡️ Security Gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: security-gate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12"

jobs:
  # ── Stage 1: Semgrep Static Analysis ─────────────────────────────────────
  semgrep-scan:
    name: 🔍 Semgrep Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Run Semgrep SAST
        id: semgrep
        run: |
          pip install semgrep
          semgrep scan --config="p/default" --config="p/owasp-top-ten" --config="p/typescript" --config="p/nodejs" --config="p/security-audit" --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: 📤 Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: 📊 Generate Semgrep summary
        if: always()
        run: |
          echo "## 🔍 Semgrep Analysis Results" >> $GITHUB_STEP_SUMMARY
          if [ -f semgrep.sarif ]; then
            TOTAL_FINDINGS=$(cat semgrep.sarif | jq '.runs[0].results | length')
            ERRORS=$(cat semgrep.sarif | jq '[.runs[0].results[] | select(.level == "error")] | length')
            WARNINGS=$(cat semgrep.sarif | jq '[.runs[0].results[] | select(.level == "warning")] | length')
            NOTES=$(cat semgrep.sarif | jq '[.runs[0].results[] | select(.level == "note")] | length')

            echo "### 📊 Vulnerability Matrix" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Errors (High) | ${ERRORS} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Warnings (Medium) | ${WARNINGS} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔵 Notes (Low) | ${NOTES} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Static Analysis Findings:** ${TOTAL_FINDINGS}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** No SARIF output generated." >> $GITHUB_STEP_SUMMARY
          fi
  # ── Stage 2: Snyk Dependency Vulnerability Scan ──────────────────────────
  snyk-scan:
    name: 🛡️ Snyk Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Run Snyk security scan
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: \${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --json-file-output=snyk.json

      - name: 📊 Generate Snyk summary
        if: always()
        run: |
          echo "## 🛡️ Snyk Dependency Scan Results" >> $GITHUB_STEP_SUMMARY
          
          if [ -f snyk.json ]; then
            # 1. Calculate values safely into clean shell variables
            CRITICAL_COUNT=\$(cat snyk.json | jq '[if type=="array" then .[] else . end | .vulnerabilities[]? | select(.severity == "critical")] | length')
            HIGH_COUNT=\$(cat snyk.json | jq '[if type=="array" then .[] else . end | .vulnerabilities[]? | select(.severity == "high")] | length')
            
            # 2. Determine status strings safely before writing to markdown
            if [ "\$CRITICAL_COUNT" -gt 0 ]; then CRITICAL_ACT="❌ Immediate Fix Required"; else CRITICAL_ACT="✅ Clean"; fi
            if [ "\$HIGH_COUNT" -gt 0 ]; then HIGH_ACT="❌ Fix Required"; else HIGH_ACT="✅ Clean"; fi

            # 3. Print out the structured table cleanly
            echo "### 📦 Dependency Risk Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Severity Level | Count | Action |" >> $GITHUB_STEP_SUMMARY
            echo "|----------------|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🚨 Critical    | \${CRITICAL_COUNT} | \({CRITICAL_ACT} \vert{}" >> \)GITHUB_STEP_SUMMARY
            echo "| 🔴 High        | \${HIGH_COUNT} | \({HIGH_ACT} \vert{}" >> \)GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "\(CRITICAL_COUNT" -eq 0 ] && [ "\)HIGH_COUNT" -eq 0 ]; then
              echo "**Status:** ✅ No high or critical dependencies vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Status:** ⚠️ Vulnerabilities detected. Review package locks or run \`pnpm audit\` locally." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Status:** No Snyk output payload discovered." >> $GITHUB_STEP_SUMMARY
          fi
  # ── Stage 3: Next.js Production Web Build ───────────────────────────────
  next-build:
    name: 🚀 Next.js Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 💾 Setup Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build Next.js application
        run: pnpm build
  # ── Stage 4: Security & Build Gate Verdict ────────────────────────────────
  security-verdict:
    name: 🏁 Quality Gate Verdict
    runs-on: ubuntu-latest
    needs: [semgrep-scan, snyk-scan, next-build]
    if: always()

    steps:
      - name: 🏁 Evaluate gate status
        run: |
          echo "## 🏁 Quality Gate Verdict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage     | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep   |  needs.semgrep-scan.result |" >> GITHUB_STEP_SUMMARY
          echo "| Snyk      |  needs.snyk-scan.result |" >> GITHUB_STEP_SUMMARY
          echo "| Web Build |  needs.next-build.result |" >> GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Handle Failure Verdict
        if: |
          needs.semgrep-scan.result == 'failure' || 
          needs.snyk-scan.result == 'failure' || 
          needs.next-build.result == 'failure'
        run: |
          echo "### ❌ Quality Gate: **FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review errors and push new commits to this PR to automatically re-trigger." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: ✅ Handle Success Verdict
        if: |
          needs.semgrep-scan.result == 'success' && 
          needs.snyk-scan.result == 'success' && 
          needs.next-build.result == 'success'
        run: |
          echo "### ✅ Quality Gate: **PASSED**" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: security-gate
          message: |
            ## 🛡️ Sentinel Quality Gate Report

            | Gate Type | Status |
            |---------|--------|
            | Semgrep SAST | \${{ needs.semgrep-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Snyk Dependencies | \${{ needs.snyk-scan.result == 'success' && '✅ Passed' || '⚠️ Review needed' }} |
            | Next.js Web Build | \${{ needs.next-build.result == 'success' && '✅ Passed' || '❌ Failed' }} |

            **Overall:** \${{ (needs.semgrep-scan.result == 'success' && needs.snyk-scan.result == 'success' && needs.next-build.result == 'success') && '✅ Gate PASSED' || '❌ Gate FAILED — push fixes to re-trigger' }}

            ---
            _Automatically re-runs on every push to this PR (`synchronize` event)._
            _Powered by [Sentinel Reviewer](https://github.com{{ github.repository }})_
